name: Android quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5554
      CI: 'true'
      # No live account, VPS, Firebase configuration or signing secrets are injected.
      MEETSPACE_STAGE05_LIVE: '0'
      MEETSPACE_STAGE06_LIVE: '0'
      MEETSPACE_STAGE07_LIVE: '0'
      MEETSPACE_STAGE08_LIVE: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Install Android tools and isolated emulator image
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          test ! -f app/google-services.json
          for name in MEETSPACE_KEYSTORE MEETSPACE_KEY_ALIAS MEETSPACE_STORE_PASSWORD MEETSPACE_KEY_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              echo "This verification workflow expects unsigned release outputs."
              exit 1
            fi
          done
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 - "$sdkmanager" <<'PY'
          import subprocess, sys
          subprocess.run([sys.argv[1], '--licenses'], input=b'y\n' * 100, check=True, stdout=subprocess.DEVNULL)
          PY
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p build/reports/stage09
          "$ANDROID_HOME/emulator/emulator" -version > build/reports/stage09/emulator-version.txt
          "$sdkmanager" --list_installed > build/reports/stage09/sdk-packages.txt

      - name: Unit, lint, debug APK, unsigned release APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > build/reports/stage09/release-dependencies.txt

      - name: Installer and verification regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s installer/tests -p 'test_*.py' -v
          python3 -m unittest discover -s testing/stage09 -p 'test_*.py' -v

      - name: Fetch hash-pinned official bundletool and verify artifacts
        run: |
          set -euo pipefail
          mkdir -p .audit/tools/bundletool
          bundletool=.audit/tools/bundletool/bundletool-all-1.18.3.jar
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -o "$bundletool"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$bundletool" | sha256sum --check --status
          python3 testing/stage09/verify_artifacts.py --bundletool "$bundletool" --report build/reports/stage09/artifact-verification.json

      - name: Offline Compose and native loader instrumentation
        timeout-minutes: 25
        run: |
          set -euo pipefail
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          printf 'no\n' | "$avdmanager" create avd --force --name meetspace-ci --package 'system-images;android-35;google_apis;x86_64'
          "$emulator" -avd meetspace-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader -memory 2048 > build/reports/stage09/emulator.log 2>&1 &
          emulator_pid=$!
          trap '"$adb" -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT
          timeout 240 "$adb" -s "$ANDROID_SERIAL" wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$("$adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true
          "$adb" -s "$ANDROID_SERIAL" shell input keyevent 82
          "$adb" -s "$ANDROID_SERIAL" shell wm size 2560x1600
          "$adb" -s "$ANDROID_SERIAL" shell wm density 320
          "$adb" -s "$ANDROID_SERIAL" shell settings put system font_scale 1.0
          "$adb" -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          "$adb" -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          "$adb" -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
          "$adb" -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk > build/reports/stage09/device-api.txt
          "$adb" -s "$ANDROID_SERIAL" shell getprop ro.product.cpu.abi > build/reports/stage09/device-abi.txt
          "$adb" -s "$ANDROID_SERIAL" shell getconf PAGE_SIZE > build/reports/stage09/device-page-size.txt
          # Explicit class allowlist: no private fixture files or production credentials.
          classes='com.meetspace.app.FoundationUiTest,com.meetspace.app.MeetingsUiTest,com.meetspace.app.CallUiTest,com.meetspace.app.MessagingUiTest,com.meetspace.app.RecordingsUiTest,com.meetspace.app.SettingsUiTest,com.meetspace.app.InstallerUiTest,com.meetspace.app.SshWizardUiTest,com.meetspace.app.NativeLibrariesSmokeTest,com.meetspace.app.RegistrationUiTest,com.meetspace.app.CallLifecyclePriorityTest,com.meetspace.app.CallPermissionLifecycleTest,com.meetspace.app.ScreenShareLifecycleTest,com.meetspace.app.NotificationCenterUiTest,com.meetspace.app.RecordingPreviewTest,com.meetspace.app.MessagingNotificationsTest'
          ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$classes" "-Pandroid.testInstrumentationRunnerArguments.verifyNotificationSound=true" "-Pandroid.testInstrumentationRunnerArguments.auditOffline=true"

      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-quality-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/
            app/build/outputs/androidTest-results/
            app/build/reports/
            core/*/build/reports/
            build/reports/stage09/
